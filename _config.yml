title: "Copilot Studio 에이전트 구축 실습"
description: >-
  SharePoint 위에서 지식·커넥터·에이전트 흐름·토픽·HITL을 다루는 오전 3시간 과정입니다.
baseurl: "/cs_lab_tdg"
url: "https://jm-2ktech.github.io"

theme: just-the-docs
plugins:
  - jekyll-feed

# 코드블록 복사 버튼 — 테마 기본값도 true지만, 이 교안은 복붙이 주 동작이라 명시해 둔다.
# 버튼 스타일(상시 노출·다크 배경 대응)은 _sass/custom/custom.scss에 있다.
enable_copy_code_button: true

search_enabled: true
search:
  heading_level: 2
  previews: 3

mermaid:
  version: "10.9.1"

aux_links:
  "Microsoft Learn Copilot Studio":
    - "https://learn.microsoft.com/ko-kr/microsoft-copilot-studio/"
  "GitHub":
    - "https://github.com/JM-2ktech/cs_lab_tdg"

# 교육 회차마다 바뀌는 값 — 본문은 {{ site.tdg.<키> }} 로 참조한다. 회차가 바뀌면 여기만 고친다.
# ⚠️ 이 파일은 공개 저장소에 올라간다.
tdg:
  forms_template_url: "https://forms.cloud.microsoft/Pages/ShareFormPage.aspx?id=byHJSWarrEiOXxuxAqx5YfA7JqsXOW5JlR-1DFl0RLBUMThBRTlaRFJCM04wVjMzOU9HVkY2N1FYVS4u&sharetoken=BnR9CmjaUfq7aWrJBfM8"

nav_sort: order
color_scheme: light

# ★ 필수 — 전 페이지 기본 레이아웃 (없으면 테마 미적용 = 맨 HTML 렌더링)
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Just the Docs callouts — 본문의 {: .note } / {: .warning } / {: .important } / {: .time } 렌더링 정의
callouts_level: quiet
callouts:
  note:
    title: 팁
    color: blue
  time:
    title: 시간
    color: green
  warning:
    title: 주의
    color: red
  important:
    title: 핵심
    color: yellow

# 빌드 제외
exclude:
  - _instructions/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
